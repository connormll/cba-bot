[project]
name = "cba-bot"
version = "0.1.0"
description = "Collective-bargaining-agreement research chatbot with recency-weighted retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Connor Mitchell" }]
dependencies = [
  "typer>=0.15",
  "rich>=13.9",
  "textual>=0.85",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "numpy>=1.26",
  "openai>=1.55",
  "fastembed>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
cba-bot = "cba_bot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cba_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
